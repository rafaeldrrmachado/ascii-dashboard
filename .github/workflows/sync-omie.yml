name: Sync OMIE Portugal Electricity Prices

on:
  schedule:
    # Run daily at 13:45 UTC (right after OMIE day-ahead market auction clears at 13:00-14:00 CET)
    - cron: '45 13 * * *'
    # Also run at 06:00 UTC for morning intraday balance
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Official OMIE Portugal Market Prices
        run: python sync_omie_pt.py

      - name: Commit and push updated dataset
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/omie_pt.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-sync OMIE Portugal market prices [skip ci]" && git push)

