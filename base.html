<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RafaelOS</title>

<style>
:root{
    --bg:#050505;
    --green:#00ff7f;
    --dim:#00aa55;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--green);
    font-family: "Consolas", "Courier New", monospace;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

#terminal{
    width:95vw;
    max-width:700px;
    padding:20px;
    border:1px solid var(--dim);
    box-shadow:0 0 20px rgba(0,255,100,0.2);
    white-space:pre-wrap;
    line-height:1.4;
    font-size:14px;
}

.blink{
    animation: blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}
</style>
</head>
<body>

<pre id="terminal"></pre>

<script>

function renderDashboard() {

    const now = new Date();

    const data = {
        weather: "22°C CLEAR",
        meetings: 2,
        tasks: 4,
        energy: "CHEAP",
        portfolio: "+0.6%",
        incidents: 12,
        sla: "84%"
    };

    const screen = `
╔══════════════════════════════════════╗
║            RAFAEL OS v1.0            ║
╠══════════════════════════════════════╣
║ DATE     ${now.toLocaleDateString().padEnd(26)}
║ TIME     ${now.toLocaleTimeString().padEnd(26)}
║ WEATHER  ${data.weather.padEnd(26)}
║ ENERGY   ${data.energy.padEnd(26)}
║ ETF      ${data.portfolio.padEnd(26)}
╠══════════════════════════════════════╣
║ WORK                                 ║
║ Meetings........ ${data.meetings}
║ Tasks........... ${data.tasks}
║ Incidents....... ${data.incidents}
║ SLA............. ${data.sla}
╠══════════════════════════════════════╣
║ AI BRIEFING                          ║
║                                      ║
║ • Focus on thesis progress           ║
║ • 1 incident nearing SLA breach      ║
║ • Electricity prices below average   ║
║                                      ║
╠══════════════════════════════════════╣
║ STATUS: ONLINE <span class="blink">█</span>
╚══════════════════════════════════════╝
`;

    document.getElementById("terminal").innerHTML = screen;
}

renderDashboard();
setInterval(renderDashboard, 1000);

</script>

</body>
</html>
